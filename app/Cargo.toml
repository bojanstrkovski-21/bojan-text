[package]
name = "bojan_text"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "bojan_text"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "clipboard", "links", "persistence"] }
image = { version = "0.25", default-features = false, features = ["png"] }
pulldown-cmark = { version = "0.13", default-features = true }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
yaml-rust = "0.4"
fancy-regex = "0.16"
arboard = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
